name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[gui]'
      - run: python -m unittest discover -s tests -v
      - run: hall-aircon --version
      - run: hall-aircon --help
      - run: hall-aircon-thermostat --help
      - run: xvfb-run -a python scripts/smoke_gui.py
